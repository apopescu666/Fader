<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="mock.css">
</head>
<body>
<div class="phone">
  <div class="island"></div>

  <div class="status">
    <span>9:41</span>
    <span class="right">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M1.4 4.1a11 11 0 0 1 14.2 0"/><path d="M4.2 6.8a7.4 7.4 0 0 1 8.6 0"/><path d="M7 9.5a3.4 3.4 0 0 1 3 0"/><circle cx="8.5" cy="11" r="0.9" fill="currentColor" stroke="none"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.5" y="0.5" width="21" height="11" rx="3.2" fill="none" stroke="currentColor" stroke-opacity="0.4"/><rect x="2.2" y="2.2" width="15.4" height="7.6" rx="1.8" fill="currentColor"/><path d="M23.2 4.2v3.6a2 2 0 0 0 0-3.6z" fill="currentColor" fill-opacity="0.4"/></svg>
    </span>
  </div>

  <div style="padding: 0 20px;">
    <h1 class="h1" style="margin-top:8px;">Setări</h1>

    <div class="section-header" style="margin-top:22px;"><span>Accesibilitate</span></div>
    <div class="card">
      <div class="row compact">
        <div class="icon-box teal" style="width:32px;height:32px;border-radius:8px;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 6V4h16v2M12 4v16M9 20h6"/></svg>
        </div>
        <div class="grow"><div class="name" style="font-size:16px;">Text mărit</div></div>
        <div class="switch on"></div>
      </div>
      <div class="row compact">
        <div class="icon-box blue" style="width:32px;height:32px;border-radius:8px;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17" stroke-linecap="round"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor" stroke="none"/></svg>
        </div>
        <div class="grow"><div class="name" style="font-size:16px;">Contrast ridicat</div></div>
        <div class="switch on"></div>
      </div>
      <div class="row compact">
        <div class="icon-box purple" style="width:32px;height:32px;border-radius:8px;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="7" y="2.5" width="10" height="19" rx="2.6"/><path d="M10.5 6.5h3"/></svg>
        </div>
        <div class="grow"><div class="name" style="font-size:16px;">Feedback haptic</div></div>
        <div class="switch on"></div>
      </div>
      <div class="row compact">
        <div class="icon-box" style="width:32px;height:32px;border-radius:8px;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5h10.5v8H10l-3.5 3v-3H4z"/><path d="M17 8.5h3v8h-2.5v2.5L14.5 16.5H13"/></svg>
        </div>
        <div class="grow"><div class="name" style="font-size:16px;">Anunță melodia nouă</div></div>
        <div class="switch on"></div>
      </div>
    </div>

    <div class="section-header" style="margin-top:22px;"><span>Redare</span></div>
    <div class="card">
      <div class="row compact">
        <div class="grow"><div class="name" style="font-size:16px;">Crossfade</div></div>
        <span class="value">4 s</span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </div>
      <div class="row compact">
        <div class="grow"><div class="name" style="font-size:16px;">Calitate streaming</div></div>
        <span class="value">Automată</span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </div>
      <div class="row compact">
        <div class="grow"><div class="name" style="font-size:16px;">Redare fără pauze</div></div>
        <div class="switch on"></div>
      </div>
    </div>

    <div class="section-header" style="margin-top:22px;"><span>Surse</span></div>
    <div class="card">
      <div class="row compact">
        <div class="dot"></div>
        <div class="grow"><div class="name" style="font-size:16px;">Fader NAS</div></div>
        <span class="value" style="font-size:14px;">Conectat</span>
      </div>
      <div class="row compact">
        <div class="icon-box" style="width:32px;height:32px;border-radius:8px;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </div>
        <div class="grow"><div class="name" style="font-size:16px;color:var(--accent);">Adaugă sursă</div></div>
      </div>
    </div>

    <div class="footnote" style="margin-top:16px;">Fader Mobil 0.1 (1) · Android 15<br>Construit cu Media3 · fără cod AIMP</div>
  </div>

  <div class="tabbar">
    <div class="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="7.5" width="12.5" height="12.5" rx="3.2"/><path d="M8 4.5h8.6a3 3 0 0 1 3 3V16"/></svg>
      <span>Bibliotecă</span>
    </div>
    <div class="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6.5h16M4 12h16M4 17.5h10"/></svg>
      <span>Coadă</span>
    </div>
    <div class="tab active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7.5h9M18.5 7.5H20M4 16.5h2.5M12 16.5h8"/><circle cx="15.5" cy="7.5" r="2.4"/><circle cx="9" cy="16.5" r="2.4"/></svg>
      <span>Setări</span>
    </div>
  </div>

  <div class="home"></div>
</div>
</body>
</html>
